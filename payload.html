<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>جاري تشغيل GoldHEN...</title>
    <style>
        body {
            /* خلفية مدمجة وشبه شفافة لقبضة الـ PS4 */
            background: linear-gradient(rgba(11, 20, 38, 0.88), rgba(11, 20, 38, 0.88)), 
                        url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            min-height: 100vh;
            margin: 0;
        }
        .loader {
            border: 16px solid #14213d;
            border-top: 16px solid #00bcd4;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            margin: 0 auto 30px auto;
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.4);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #00bcd4;
            text-shadow: 0 0 8px rgba(0, 188, 212, 0.3);
            margin-bottom: 5px;
        }
        .created-by {
            background: linear-gradient(to left, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        p {
            color: #b0bec5;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>جاري تحميل ثغرة pOOBs4 وإرسال ملف GoldHEN v2.4...</h2>
    
    <!-- جملة الحقوق المضافة بناءً على طلبك -->
    <div class="created-by">جاري التحميل بواسطة: amora.bk</div>
    
    <p>يرجى الانتظار وعدم إغلاق المتصفح أو إطفاء الجهاز.</p>

</body>
</html>
